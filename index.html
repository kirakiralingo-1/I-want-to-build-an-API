<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #fff; padding: 2rem; }
    h1 { margin-bottom: 1rem; }
    .input-row { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    input { flex: 1; padding: .6rem; border: 1px solid #444; border-radius: 4px; background: #1e1e1e; color: #fff; font-size: 1rem; }
    button { padding: .6rem 1.2rem; border: none; border-radius: 4px; background: #ff0000; color: #fff; font-size: 1rem; cursor: pointer; }
    video { width: 100%; max-width: 854px; border-radius: 8px; }
    #status { margin-top: .5rem; color: #aaa; }
  </style>
</head>
<body>
  <h1>MyTube</h1>
  <div class="input-row">
    <input type="text" id="videoId" placeholder="動画ID (例: dQw4w9WgXcQ)">
    <button onclick="loadVideo()">再生</button>
  </div>
  <video id="player" controls></video>
  <p id="status"></p>

  <script>
    function extractId(input) {
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      let m = input.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
      if (m) return m[1];
      m = input.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
      if (m) return m[1];
      return null;
    }

    async function loadVideo() {
      const raw = document.getElementById('videoId').value.trim();
      const id = extractId(raw);
      const status = document.getElementById('status');
      const player = document.getElementById('player');

      if (!id) { status.textContent = '無効な動画ID'; return; }
      status.textContent = '読み込み中...';

      try {
        const res = await fetch(`/api/stream?id=${id}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        if (typeof data.streamUrl === 'string') {
          player.src = data.streamUrl;
        } else if (data.streamUrl?.videoUrl) {
          player.src = data.streamUrl.videoUrl;
        }
        player.play();
        status.textContent = '再生中';
      } catch (e) {
        status.textContent = 'エラー: ' + e.message;
      }
    }

    document.getElementById('videoId').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadVideo();
    });
  </script>
</body>
</html>
