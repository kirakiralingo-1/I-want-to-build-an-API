<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inv Lite</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui; max-width: 860px; margin: 2rem auto; padding: 0 1rem; background: #0f0f0f; color: #fff; }
  .search { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  input { flex: 1; padding: .6rem; font-size: 1rem; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; }
  button { padding: .6rem 1.2rem; border-radius: 6px; border: none; background: #ff0000; color: #fff; cursor: pointer; }
  video { width: 100%; border-radius: 8px; margin-top: 1rem; background: #000; }
  .meta { margin-top: .8rem; }
  .meta h3 { margin: 0 0 .3rem; }
  .meta p { margin: 0; color: #aaa; font-size: .9rem; }
</style>
</head>
<body>
<h1>Inv Lite</h1>
<div class="search">
  <input id="q" placeholder="動画ID / YouTube URL" onkeydown="if(event.key==='Enter')play()">
  <button onclick="play()">再生</button>
</div>
<div id="out"></div>

<script>
const $ = id => document.getElementById(id);

async function play() {
  const q = $('q').value.trim();
  if (!q) return;
  const id = q.match(/(?:v=|youtu\.be\/)([\w-]{11})/)?.[1] || (q.match(/^[\w-]{11}$/) ? q : null);
  if (!id) return alert('動画IDを指定してください');

  $('out').innerHTML = '<p>Loading…</p>';

  // メタ情報取得
  const meta = await fetch(`/api/video/${id}`).then(r => r.ok ? r.json() : {});

  $('out').innerHTML = `
    <video id="player" controls autoplay></video>
    <div class="meta">
      <h3>${meta.title || ''}</h3>
      <p>${meta.author_name || ''}</p>
    </div>`;

  // ストリーム再生（プロキシ経由）
  const player = $('player');
  player.src = `/api/stream/${id}`;
}
</script>
</body>
</html>
