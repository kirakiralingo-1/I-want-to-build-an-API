<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Inv</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui; background: #0f0f0f; color: #fff; padding: 2rem; }
    h1 { margin-bottom: 1rem; }
    .search { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    .search input { flex: 1; padding: .6rem; border-radius: 4px; border: 1px solid #333; background: #1a1a1a; color: #fff; }
    .search button { padding: .6rem 1.2rem; border-radius: 4px; border: none; background: #f00; color: #fff; cursor: pointer; }
    video { width: 100%; max-width: 854px; border-radius: 8px; }
    .meta { margin-top: 1rem; }
    .meta h2 { font-size: 1.2rem; }
    .meta p { color: #aaa; }
    .formats { margin-top: .5rem; display: flex; gap: .5rem; }
    .formats button { padding: .3rem .8rem; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; cursor: pointer; }
    .formats button.active { background: #f00; border-color: #f00; }
  </style>
</head>
<body>
  <h1>Inv</h1>
  <div class="search">
    <input id="url" type="text" placeholder="YouTube URL を貼る">
    <button onclick="load()">再生</button>
  </div>
  <video id="player" controls></video>
  <div class="meta" id="meta"></div>

  <script>
    function extractId(url) {
      const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
      return m ? m[1] : null;
    }

    async function load() {
      const url = document.getElementById('url').value.trim();
      const id = extractId(url);
      if (!id) return alert('無効なURL');

      const res = await fetch(`/api/info?v=${id}`);
      const info = await res.json();
      if (info.error) return alert(info.error);

      document.getElementById('meta').innerHTML =
        `<h2>${info.title}</h2><p>${info.author} (itag ${info.itag})</p>`;

      const player = document.getElementById('player');
      player.src = `/api/stream?v=${id}`;
      player.play();
    }

    document.getElementById('url').addEventListener('keydown', e => {
      if (e.key === 'Enter') load();
    });
  </script>
</body>
</html>
